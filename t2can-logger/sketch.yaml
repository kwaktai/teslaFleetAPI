# Arduino IDE 2 / arduino-cli 가 이 폴더를 열면 아래 보드 설정을 씁니다.
# 다른 스케치(2CAN_FD.ino)를 열면 기본값(4MB, CDC 꺼짐)으로 돌아가니
# 항상 이 폴더의 t2can-logger.ino 만 여세요.

default_fqbn: esp32:esp32:esp32s3:CDCOnBoot=cdc,USBMode=hwcdc,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=opi,CPUFreq=240,FlashMode=qio,UploadSpeed=921600,UploadMode=default,DebugLevel=none,EraseFlash=none
default_port_config:
  baudrate: "115200"

profiles:
  t2can-fd:
    notes: LILYGO T-2CAN FD (ESP32-S3, 16MB, OPI PSRAM, FFat 로그)
    fqbn: esp32:esp32:esp32s3:CDCOnBoot=cdc,USBMode=hwcdc,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB,PSRAM=opi,CPUFreq=240,FlashMode=qio,UploadSpeed=921600,UploadMode=default,DebugLevel=none,EraseFlash=none,JTAGAdapter=default,LoopCore=1,EventsCore=1
    platforms:
      - platform: esp32:esp32 (3.3.11)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json

default_profile: t2can-fd
