# version 키는 Compose v2에서는 무시되지만, 구버전 Docker 패키지(DSM 7.0~7.1)의
# docker-compose v1 에서는 이 키가 없으면 파일을 해석하지 못합니다.
version: "3.8"

services:
  tesla-fleet-api:
    build: .
    container_name: tesla-fleet-api
    restart: unless-stopped
    ports:
      # 호스트 포트:컨테이너 포트 — DSM 역방향 프록시가 이 호스트 포트로 전달합니다.
      # 호스트 포트는 .env 의 HOST_PORT 로 바꿀 수 있습니다 (기본 8080).
      - "${HOST_PORT:-8080}:8080"
    environment:
      TESLA_CLIENT_ID: ${TESLA_CLIENT_ID}
      TESLA_CLIENT_SECRET: ${TESLA_CLIENT_SECRET}
      TESLA_DOMAIN: ${TESLA_DOMAIN}
      TESLA_REGION: ${TESLA_REGION:-na}
      API_KEY: ${API_KEY:-}
      VEHICLE_ALIASES: ${VEHICLE_ALIASES:-}
      WAKE_TIMEOUT_SECONDS: ${WAKE_TIMEOUT_SECONDS:-30}
      PRICE_COMMAND: ${PRICE_COMMAND:-1.4}
      PRICE_DATA: ${PRICE_DATA:-2.7}
      PRICE_WAKE: ${PRICE_WAKE:-25}
      PRICE_CURRENCY: ${PRICE_CURRENCY:-₩}
      MONTHLY_CREDIT: ${MONTHLY_CREDIT:-14020}
      # TESLA_SCOPES: "openid offline_access vehicle_device_data ..."
    volumes:
      # 키/토큰 영구 저장 (시놀로지 경로 예: /volume1/docker/tesla-fleet-api/data)
      - ./data:/data
    depends_on:
      - tesla-http-proxy

  # 차량 명령에 개인키로 서명하는 Tesla 공식 프록시.
  # tesla-fleet-api 는 도커 내부 네트워크로 접근하므로 아래 호스트 포트는 없어도 동작합니다.
  # 이 포트에는 역방향 프록시나 포트포워딩을 걸지 마세요.
  # 프록시에는 API 키 인증이 없고 Tesla 액세스 토큰만으로 명령을 받습니다.
  tesla-http-proxy:
    build: ./proxy
    container_name: tesla-http-proxy
    restart: unless-stopped
    ports:
      - "${PROXY_HOST_PORT:-9102}:4443"
    volumes:
      - ./data:/data
